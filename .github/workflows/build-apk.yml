name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Project
        # ابتدا اسکریپت اصلی پروژه را اجرا می‌کنیم
        run: npm run build
        continue-on-error: true

      - name: Fallback Build (اگر مرحله قبل خطا داد)
        if: failure()
        run: npx vite build

      - name: Verify Build Output
        # این مرحله بررسی می‌کند که آیا پوشه dist واقعاً ساخته شده است یا خیر
        run: |
          echo "Checking dist folder contents:"
          ls -la dist || echo "ERROR: dist folder not found!"

      - name: Setup Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
          # استفاده از --force برای بازنویسی تنظیمات قبلی در صورت وجود
          npx cap init "AcornApp" "com.thepoo7an.acorn" --web-dir=dist --force
          npx cap add android
          npx cap sync android

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          # اضافه کردن --stacktrace برای دریافت جزئیات دقیق خطا در صورت شکست
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acorn-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
