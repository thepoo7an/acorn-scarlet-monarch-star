name: Build Android APK

on:
  workflow_dispatch: # این گزینه اجازه می‌دهد فرآیند را به صورت دستی از تب Actions اجرا کنید

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Project
        # از دستور مستقیم vite build استفاده می‌کنیم تا از خطاهای احتمالی اسکریپت‌های سفارشی جلوگیری شود
        run: npx vite build

      - name: Setup Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
          npx cap init "AcornApp" "com.thepoo7an.acorn" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acorn-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
