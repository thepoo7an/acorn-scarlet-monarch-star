name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Version 22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Project
        run: npm run build
        continue-on-error: true

      - name: Fallback Build
        if: failure()
        run: npx vite build

      - name: Setup Capacitor
        run: |
          echo "--- وضعیت پوشه‌ها قبل از حذف ---"
          ls -la
          
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
          
          npx cap init "AcornApp" "com.thepoo7an.acorn" --web-dir=dist --force
          
          echo "--- در حال حذف پوشه android قدیمی ---"
          rm -rf android
          
          echo "--- وضعیت پوشه‌ها بعد از حذف (android نباید اینجا باشد) ---"
          ls -la
          
          echo "--- افزودن پلتفرم اندروید ---"
          npx cap add android
          npx cap sync android

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acorn-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
